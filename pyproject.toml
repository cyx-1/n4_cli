[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n4-cli"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0",
    "questionary>=2.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
n4_cli = "n4_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["n4_cli"]

[tool.hatch.build.targets.wheel.force-include]
"n4_cli/assets/clipboard-viewer.html" = "n4_cli/assets/clipboard-viewer.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
